name: 小红书/RedNote 去水印去广告(Egern版·水印拦截法)
description: 由 Surge 模块 Xiaohongshu_WatermarkFix.sgmodule 转换而来。采用 QingRex 思路：Map Local 拦截 watermark 水印配置接口，让红书客户端拿不到水印配置，从而所有图片(含评论区)无死角去水印。适配海外版 RedNote(rnote.com)。
author: xchun5678 (Egern 转换版)
homepage: https://github.com/xchun5678/surge

rules:
  # 屏蔽 QUIC，让红书走可 MITM 处理的 HTTP
  - and:
      match:
        - protocol:
            match: quic
        - domain_suffix:
            match: rnote.com
    policy: REJECT
  - and:
      match:
        - protocol:
            match: quic
        - domain_suffix:
            match: xhscdn.com
    policy: REJECT
  - and:
      match:
        - protocol:
            match: quic
        - domain_suffix:
            match: rednotecan.com
    policy: REJECT
  # 红书 CDN 直连
  - domain_suffix:
      match: rednotecan.com
    policy: DIRECT
  - domain_suffix:
      match: xhscdn.com
    policy: DIRECT
  - domain_suffix:
      match: rnote.com
    policy: DIRECT

map_locals:
  # 拦截水印配置接口（QingRex 方法核心）→ 客户端拿不到水印，全图无死角去水印
  # 原 Surge 用 data-type=tiny-gif，Egern 无此语法，这里返回 200 + 空 JSON 配置达到同样效果
  - match: '^https://ci\.xiaohongshu\.com/system_config/watermark'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https://ci\.rnote\.com/system_config/watermark'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https://edith\.(?:xiaohongshu|rnote)\.com/api/sns/v1/system/config/watermark'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https://www\.(?:xiaohongshu|rnote)\.com/api/sns/v1/system_config/watermark'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  # 拦截广告配置接口
  - match: '^https://ci\.(?:xiaohongshu|rnote)\.com/system_config/(?:advertise|splash)'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'

scriptings:
  # ===== 去广告/去水印（RedPaper 脚本，覆盖海外版 rnote 域名） =====
  # 注意：脚本源 kelee.one 当前对代理出口返回 403，脚本可能加载失败，仅 Map Local 去水印不依赖脚本
  - http_response:
      name: 移除图片和实况照片水印
      match: '^https://edith\.rnote\.com/api/sns/v1/note/(?:imagefeed|live_photo/save)(\?|$)'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除界面配置
      match: '^https://edith\.rnote\.com/api/sns/v1/system/service/ui/config\?'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除开屏广告
      match: '^https://edith\.rnote\.com/api/sns/v1/system_service/config\?'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除开屏splash
      match: '^https://edith\.rnote\.com/api/sns/v2/system_service/splash_config'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除详情页小部件
      match: '^https://edith\.rnote\.com/api/sns/v2/(?:note/widgets|user/followings/followfeed)'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除信息流广告(v4)
      match: '^https://edith\.rnote\.com/api/sns/v4/followfeed\?'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除详情页感兴趣的人
      match: '^https://edith\.rnote\.com/api/sns/v5/recommend/user/follow_recommend\?'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除评论区实况照片水印
      match: '^https://edith\.rnote\.com/api/sns/(?:v1/interaction/comment/video/download|v5/note/comment/list)'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除图片视频水印
      match: '^https://edith\.rnote\.com/api/sns/(?:v2/note/feed|v3/note/videofeed)'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除信息流广告(v6)
      match: '^https://(?:edith|rec)\.rnote\.com/api/sns/v6/homefeed\?'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除搜索页广告
      match: '^https://(?:edith|so)\.rnote\.com/api/sns/v10/search/notes\?'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: 移除视频水印
      match: '^https://(?:edith|rec|www)\.rnote\.com/api/sns/(?:v4/note/videofeed|v10/note/video/save)'
      script_url: https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
      body_required: true

mitm:
  ca_p12: ""
  ca_passphrase: ""
  hostnames:
    includes:
      - ci.xiaohongshu.com
      - ci.rnote.com
      - edith.rnote.com
      - rec.rnote.com
      - so.rnote.com
      - www.rnote.com
      - music.rnote.com
      - "*.xhscdn.com"
      - "*.rednotecan.com"